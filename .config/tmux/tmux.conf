# Functionality

## Rebind prefix/leader to Ctrl + Space
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

## Start window numbering at 1
set -g base-index 1

## Start pane numbering at 1
setw -g pane-base-index 1

## Ensure window numbers get reordered when a window is deleted
set -g renumber-windows on

# Theming
set -g default-terminal "tmux-256color"
set -ag terminal-features ",foot:RGB"

## Nord colors
set -g status-style bg='#2E3440',fg='#D8DEE9'

## Status bar configuration
set -g status on
set -g status-interval 1
set -g status-justify centre

## Left status
set -g status-left-length 50
set -g status-left "#[fg=#88C0D0,bold] 󰆍 #S #[fg=#81A1C1]• #[fg=#8FBCBB]󰉋 #I:#P "

## Window list (center)
set-window-option -g window-status-format "#[fg=#4C566A] #I:#W "
set-window-option -g window-status-current-format "#[fg=#ECEFF4,bold] #I:#W "

## Right status with icons
set -g status-right-length 100
set -g status-right "#[fg=#81A1C1]󰁹 #{battery_percentage} #[fg=#88C0D0]• #[fg=#8FBCBB]󰀄 #(whoami) #[fg=#88C0D0]• #[fg=#81A1C1]󰟀 #H #[fg=#88C0D0]• #[fg=#8FBCBB]󱑍 %H:%M #[fg=#88C0D0]• #[fg=#81A1C1]󰸗 %d %b %Y "

## Pane borders
set -g pane-border-style fg='#4C566A'
set -g pane-active-border-style fg='#88C0D0'

## Message styling
set -g message-style bg='#4C566A',fg='#ECEFF4'

## Enable scrolling with mouse
setw -g mouse on

## Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'

run '~/.tmux/plugins/tpm/tpm'
